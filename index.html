<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Logger Pro</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --edit-color: #7c3aed;
            --sw-color: #10b981;
            --vhf-color: #f59e0b;
            --text-main: #1f2937;
            --text-sub: #555555;
            --border-color: #dddddd;
            --table-hover: #f9fafb;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --primary: #3b82f6;
            --edit-color: #a78bfa;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: #374151;
            --table-hover: #2d3748;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px;
            transition: background 0.3s, color 0.3s;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; color: var(--primary); font-size: 1.5rem; }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .input-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            border: 2px solid transparent;
        }
        
        .editing-mode { border: 2px solid var(--edit-color); }
        [data-theme="dark"] .editing-mode { background: #2e263d; }

        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); }
        
        input, select {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .btn-main {
            grid-column: 1 / -1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn-save { background-color: var(--edit-color) !important; }

        .search-container { margin-bottom: 15px; display: flex; gap: 10px; }
        #searchInput { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .btn-group { display: flex; gap: 8px; }

        .btn-secondary { background-color: #4b5563; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .btn-import { background-color: #059669; }
        .btn-snapshot { background-color: #0891b2; }
        .btn-clear { background-color: #ef4444; }

        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        
        th { 
            background-color: var(--primary); 
            color: white; 
            font-size: 0.85em; 
            text-transform: uppercase; 
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 25px;
        }
        th:hover { background-color: #1d4ed8; }

        /* Sort Indicator Styles */
        th::after { content: ' ↕'; opacity: 0.5; font-size: 0.9em; position: absolute; right: 8px; }
        th.sort-asc::after { content: ' ▲'; opacity: 1; }
        th.sort-desc::after { content: ' ▼'; opacity: 1; }

        tr:hover { background-color: var(--table-hover); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8em; color: white; font-weight: bold; display: inline-block; }
        .badge-sw { background-color: var(--sw-color); }
        .badge-vhf { background-color: var(--vhf-color); }
        
        .action-btns { display: flex; gap: 5px; }
        .edit-btn { color: var(--edit-color); border: 1px solid var(--edit-color); background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .delete-btn { color: #ef4444; border: 1px solid #ef4444; background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        
        .footer-stats { margin-top: 15px; font-size: 0.9em; color: var(--text-sub); text-align: right; }
    </style>
</head>
<body data-theme="light">

    <header>
        <h1>📡 Radio Logger</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    </header>

    <div id="formCard" class="input-card">
        <input type="hidden" id="editId">
        <div class="form-group">
            <label>Frequency (MHz)</label>
            <input type="text" id="freqInput" placeholder="e.g. 14.250" inputmode="decimal">
        </div>
        <div class="form-group">
            <label>Radio</label>
            <select id="radioInput">
                <option value="Malahit DSP2" selected>Malahit DSP2</option>
                <option value="Realistic Pro 2006">Realistic Pro 2006</option>
                <option value="Baofeng DM1701">Baofeng DM1701</option>
            </select>
        </div>
        <div class="form-group">
            <label>Antenna</label>
            <select id="antennaInput">
                <option value="GA800" selected>GA800</option>
                <option value="Whip">Whip</option>
                <option value="X30N">X30N</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mode</label>
            <select id="modeInput">
                <option value="AM">AM</option><option value="FM">FM</option>
                <option value="USB">USB</option><option value="LSB">LSB</option>
                <option value="CW">CW</option><option value="FT8">FT8</option>
                <option value="DMR">DMR</option><option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Station / Callsign</label>
            <input type="text" id="stationInput" placeholder="Who are they?">
        </div>
        <div class="form-group">
            <label>Notes</label>
            <input type="text" id="notesInput" placeholder="Signal report, etc.">
        </div>
        <button id="submitBtn" class="btn-main" onclick="handleSubmit()">Add to Log</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search logs..." onkeyup="renderTable()">
    </div>

    <div class="controls">
        <h2>Your Logs</h2>
        <div class="btn-group">
            <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="processImport()">
            <button class="btn-secondary btn-import" onclick="document.getElementById('csvFileInput').click()">⬆ Import</button>
            <button class="btn-secondary" onclick="exportData()">⬇ Export CSV</button>
            <button class="btn-secondary btn-snapshot" onclick="downloadFullSnapshot()">📸 Snapshot</button>
            <button class="btn-secondary btn-clear" onclick="clearData()">Clear</button>
        </div>
    </div>

    <div class="table-container">
        <table id="logTable">
            <thead>
                <tr>
                    <th id="dateHeader" class="sort-desc" onclick="sortTable('date', this)">UTC Time</th>
                    <th onclick="sortTable('freq', this)">Freq (MHz)</th>
                    <th onclick="sortTable('type', this)">Band</th>
                    <th onclick="sortTable('radio', this)">Radio</th>
                    <th onclick="sortTable('antenna', this)">Antenna</th>
                    <th onclick="sortTable('mode', this)">Mode</th>
                    <th>Station</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer-stats" id="logCounter">Total Logs: 0</div>

    <script id="mainScript">
        let currentSort = { key: 'date', desc: true };

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const target = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', target);
            document.getElementById('themeBtn').innerText = target === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
            localStorage.setItem('radioTheme', target);
        }

        const savedTheme = localStorage.getItem('radioTheme') || 
                           (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';

        document.addEventListener('DOMContentLoaded', renderTable);

        // Date Formatting Helper: Day Month Year Time
        function formatRadioDate(isoString) {
            const date = new Date(isoString);
            const day = String(date.getDate()).padStart(2, '0');
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = monthNames[date.getMonth()];
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${day} ${month} ${year} ${hours}:${minutes}`;
        }

        function sortTable(key, element) {
            if (currentSort.key === key) {
                currentSort.desc = !currentSort.desc;
            } else {
                currentSort.key = key;
                currentSort.desc = false;
            }

            document.querySelectorAll('th').forEach(th => th.classList.remove('sort-asc', 'sort-desc'));
            element.classList.add(currentSort.desc ? 'sort-desc' : 'sort-asc');

            renderTable();
        }

        function handleSubmit() {
            const editId = document.getElementById('editId').value;
            const freqVal = document.getElementById('freqInput').value;
            const radio = document.getElementById('radioInput').value;
            const antenna = document.getElementById('antennaInput').value;
            const mode = document.getElementById('modeInput').value;
            const station = document.getElementById('stationInput').value.replace(/,/g, ";");
            const notes = document.getElementById('notesInput').value.replace(/,/g, ";");

            if (!freqVal || isNaN(parseFloat(freqVal))) return alert("Enter a valid frequency");
            
            const freqNum = parseFloat(freqVal);
            let logs = JSON.parse(localStorage.getItem('radioLogs')) || [];

            if (editId) {
                const index = logs.findIndex(l => l.id == editId);
                if (index !== -1) {
                    logs[index].freq = freqNum;
                    logs[index].type = (freqNum <= 30) ? "Shortwave" : "VHF/UHF";
                    logs[index].radio = radio;
                    logs[index].antenna = antenna;
                    logs[index].mode = mode;
                    logs[index].station = station;
                    logs[index].notes = notes;
                }
                cancelEdit();
            } else {
                const logEntry = {
                    id: Date.now(),
                    date: new Date().toISOString(), // Keep ISO for internal sorting
                    freq: freqNum,
                    type: (freqNum <= 30) ? "Shortwave" : "VHF/UHF",
                    radio: radio,
                    antenna: antenna,
                    mode: mode,
                    station: station,
                    notes: notes
                };
                logs.unshift(logEntry);
            }

            localStorage.setItem('radioLogs', JSON.stringify(logs));
            renderTable();
            resetForm();
        }

        function startEdit(id) {
            let logs = JSON.parse(localStorage.getItem('radioLogs')) || [];
            const log = logs.find(l => l.id == id);
            if (!log) return;

            document.getElementById('editId').value = log.id;
            document.getElementById('freqInput').value = parseFloat(log.freq).toFixed(3);
            document.getElementById('radioInput').value = log.radio || "Malahit DSP2";
            document.getElementById('antennaInput').value = log.antenna || "GA800";
            document.getElementById('modeInput').value = log.mode;
            document.getElementById('stationInput').value = log.station;
            document.getElementById('notesInput').value = log.notes;

            document.getElementById('submitBtn').innerText = "Save Changes";
            document.getElementById('submitBtn').classList.add('btn-save');
            document.getElementById('formCard').classList.add('editing-mode');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editId').value = "";
            document.getElementById('submitBtn').innerText = "Add to Log";
            document.getElementById('submitBtn').classList.remove('btn-save');
            document.getElementById('formCard').classList.remove('editing-mode');
        }

        function resetForm() {
            document.getElementById('freqInput').value = '';
            document.getElementById('stationInput').value = '';
            document.getElementById('notesInput').value = '';
            document.getElementById('radioInput').value = "Malahit DSP2";
            document.getElementById('antennaInput').value = "GA800";
        }

        function renderTable() {
            const tbody = document.querySelector('#logTable tbody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';
            let logs = JSON.parse(localStorage.getItem('radioLogs')) || [];

            logs.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];
                if (currentSort.key === 'freq') return currentSort.desc ? valB - valA : valA - valB;
                if (valA < valB) return currentSort.desc ? 1 : -1;
                if (valA > valB) return currentSort.desc ? -1 : 1;
                return 0;
            });

            let count = 0;
            logs.forEach(log => {
                const freqDisplay = parseFloat(log.freq).toFixed(3);
                const antennaText = log.antenna || "GA800";
                const radioText = log.radio || "Malahit DSP2";
                const formattedDate = formatRadioDate(log.date);
                
                const matches = freqDisplay.includes(searchTerm) || 
                                radioText.toLowerCase().includes(searchTerm) ||
                                antennaText.toLowerCase().includes(searchTerm) ||
                                log.station.toLowerCase().includes(searchTerm) || 
                                log.mode.toLowerCase().includes(searchTerm) ||
                                log.notes.toLowerCase().includes(searchTerm);

                if (!matches && searchTerm !== "") return;

                count++;
                const row = document.createElement('tr');
                const badgeClass = (parseFloat(log.freq) <= 30) ? "badge-sw" : "badge-vhf";
                row.innerHTML = `
                    <td>${formattedDate}</td>
                    <td><strong>${freqDisplay}</strong></td>
                    <td><span class="badge ${badgeClass}">${log.type}</span></td>
                    <td>${radioText}</td>
                    <td>${antennaText}</td>
                    <td>${log.mode}</td>
                    <td>${log.station}</td>
                    <td>${log.notes}</td>
                    <td class="action-btns">
                        <button class="edit-btn" onclick="startEdit(${log.id})">Edit</button>
                        <button class="delete-btn" onclick="deleteLog(${log.id})">Del</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            document.getElementById('logCounter').innerText = "Total Logs: " + count;
        }

        function deleteLog(id) {
            if(confirm("Delete entry?")) {
                let logs = JSON.parse(localStorage.getItem('radioLogs')) || [];
                logs = logs.filter(log => log.id !== id);
                localStorage.setItem('radioLogs', JSON.stringify(logs));
                renderTable();
            }
        }

        function clearData() {
            if(confirm("Wipe all logs?")) {
                localStorage.removeItem('radioLogs');
                renderTable();
            }
        }

        function exportData() {
            const logs = JSON.parse(localStorage.getItem('radioLogs')) || [];
            if (logs.length === 0) return alert("Nothing to export");
            let csvContent = "data:text/csv;charset=utf-8,Date(UTC),Frequency,Type,Radio,Antenna,Mode,Station,Notes\n"; 
            logs.forEach(l => {
                const freqExp = parseFloat(l.freq).toFixed(3);
                csvContent += `${l.date},${freqExp},${l.type},${l.radio},${l.antenna},${l.mode},${l.station},${l.notes}\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", "radio_logs.csv");
            link.click();
        }

        function processImport() {
            const file = document.getElementById('csvFileInput').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rows = e.target.result.split("\n");
                let logs = JSON.parse(localStorage.getItem('radioLogs')) || [];
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(",");
                    if(cols.length >= 8) {
                        logs.unshift({ 
                            id: Date.now()+i, date: cols[0], freq: parseFloat(cols[1]), 
                            type: cols[2], radio: cols[3], antenna: cols[4], 
                            mode: cols[5], station: cols[6], notes: cols[7] 
                        });
                    }
                }
                localStorage.setItem('radioLogs', JSON.stringify(logs));
                renderTable();
                alert("Imported!");
            };
            reader.readAsText(file);
        }

        function downloadFullSnapshot() {
            const logs = localStorage.getItem('radioLogs') || "[]";
            const theme = document.body.getAttribute('data-theme') || "light";
            let htmlContent = document.documentElement.outerHTML;
            const dataInjector = `
            <script>
                localStorage.setItem('radioLogs', JSON.stringify(${logs}));
                localStorage.setItem('radioTheme', '${theme}');
            <\/script>`;
            const blob = new Blob([htmlContent + dataInjector], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `RadioLogger_Snapshot_${new Date().toISOString().substring(0,10)}.html`;
            link.click();
        }
    </script>
</body>
</html>
